name: Publish npm package and GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release gate — Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: [22.x]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Ensure tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package.json: ${package_version}"
          echo "git tag:      ${tag_version}"
          test "${package_version}" = "${tag_version}"
      - name: Install from lockfile
        run: npm ci
      - name: Verify build and tests
        run: npm run verify
        env:
          CODEDB_ALLOW_TEMP: "1"

  publish:
    name: Publish and create release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global 'npm@^11.5.1'
          node --version
          npm --version
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
        env:
          CODEDB_ALLOW_TEMP: "1"
      - name: Build publish tarball
        id: pack
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          tarball="${package_name}-${package_version}.tgz"
          release_tag="v${package_version}"
          npm pack
          test -f "${tarball}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
      - name: Publish to npm (OIDC Trusted Publishing or NPM_TOKEN)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CODEDB_ALLOW_TEMP: "1"
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            unset NODE_AUTH_TOKEN
            npm config delete //registry.npmjs.org/:_authToken || true
          fi
          npm publish --access public --provenance
      - name: Create or update GitHub Release and attach npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.pack.outputs.release_tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${{ steps.pack.outputs.tarball }}" --clobber
          else
            gh release create "${tag}" "${{ steps.pack.outputs.tarball }}" --verify-tag --generate-notes
          fi
