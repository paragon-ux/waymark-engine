name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, not windows-latest: windows-latest migrated to the
        # VS 2026 image, which node-gyp < 12.1 (bundled with Node 22.x)
        # cannot detect, so native modules (better-sqlite3 et al. via
        # capn-hook -> @tobilu/qmd) fail node-gyp rebuild with
        # "Could not find any Visual Studio installation to use".
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: [22.x]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Verify build and tests
        run: npm run verify
