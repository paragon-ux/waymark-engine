<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waymark Engine - Live Agent Monitor</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --purple: #bc8cff;
      --red: #f85149;
    }
    * { box-sizing: border-box; }

    html {
      font-size: 125%; /* 16px * 1.25 = 20px base scale */
      height: 100%;
      overflow: hidden; /* Hard guarantee: window never spawns an outer scrollbar */
    }

    body {
      height: 100%;
      margin: 0;
      padding: 1.2rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    /* Header and metric cards never shrink */
    .header,
    .metrics {
      flex-shrink: 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.8rem;
      margin-bottom: 1rem;
    }

    .title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(63, 185, 80, 0.15);
      color: var(--green);
      font-size: 0.6rem;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      border: 1px solid rgba(63, 185, 80, 0.3);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem;
    }

    .card-title {
      font-size: 0.6rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.3rem;
    }

    .card-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    /* Event container fills the remaining vertical viewport space */
    .events-container {
      flex: 1;
      min-height: 0; /* Critical in CSS Flexbox: allows container to shrink below content size */
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .events-header {
      flex-shrink: 0;
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.7rem;
      display: flex;
      justify-content: space-between;
    }

    /* The ONLY scrollbar on the page */
    .event-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto; /* Sole scrollable element */
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: none; /* Remove arbitrary 600px cap */
    }

    .event-item {
      padding: 0.7rem 0.8rem;
      border-bottom: 1px solid var(--border);
      font-family: monospace;
      font-size: 0.65rem;
    }

    .event-item:last-child {
      border-bottom: none;
    }

    .event-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.3rem;
    }

    .event-query {
      color: #fff;
      font-weight: 600;
    }

    .pill {
      font-size: 0.55rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .pill-hit { background: rgba(63,185,80,0.2); color: var(--green); }
    .pill-miss { background: rgba(248,81,73,0.2); color: var(--red); }
    .pill-junction { background: rgba(210,153,34,0.2); color: var(--yellow); }
    .pill-source { background: rgba(88,166,255,0.2); color: var(--accent); }

    .event-meta {
      display: flex;
      gap: 0.8rem;
      color: var(--text-muted);
      font-size: 0.6rem;
      margin-top: 0.2rem;
      flex-wrap: wrap;
    }

    .event-match {
      color: var(--green);
    }

    .token-savings {
      color: var(--purple);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>WAYMARK ENGINE LIVE MONITOR</span>
      <span class="status-badge"><span class="pulse-dot"></span> LIVE LISTENING</span>
    </div>
    <div id="repo-info" style="color: var(--text-muted); font-size: 0.65rem;"></div>
  </div>

  <div class="metrics">
    <div class="card">
      <div class="card-title">Total Queries</div>
      <div id="m-total" class="card-value">0</div>
    </div>
    <div class="card">
      <div class="card-title">Hit Rate</div>
      <div id="m-hitrate" class="card-value">0%</div>
    </div>
    <div class="card">
      <div class="card-title">Net Token Savings</div>
      <div id="m-savings" class="card-value" style="color: var(--purple);">0%</div>
    </div>
    <div class="card">
      <div class="card-title">Avg Latency</div>
      <div id="m-latency" class="card-value">0ms</div>
    </div>
  </div>

  <div class="events-container">
    <div class="events-header">
      <span>Query Telemetry Stream</span>
      <span id="event-count" style="color: var(--text-muted);">0 events</span>
    </div>
    <ul id="event-list" class="event-list"></ul>
  </div>

  <script>
    const evtSource = new EventSource('/events');
    const eventList = document.getElementById('event-list');
    const mTotal = document.getElementById('m-total');
    const mHitrate = document.getElementById('m-hitrate');
    const mSavings = document.getElementById('m-savings');
    const mLatency = document.getElementById('m-latency');
    const evtCount = document.getElementById('event-count');

    function updateStats(stats) {
      if (!stats) return;
      mTotal.textContent = stats.total ?? 0;
      mHitrate.textContent = (stats.hitRatePct ?? 0) + '%';
      mSavings.textContent = (stats.netSavingsPct ?? 0) + '%';
      mLatency.textContent = (stats.avgLatencyMs ?? 0) + 'ms';
      evtCount.textContent = (stats.total ?? 0) + ' events';
    }

    function renderEvent(ev, prepend = false) {
      const li = document.createElement('li');
      li.className = 'event-item';
      const time = ev.timestamp ? ev.timestamp.split('T')[1].slice(0, 8) : '';
      const pillClass = ev.status === 'hit' ? 'pill-hit' : (ev.status === 'junction' ? 'pill-junction' : 'pill-miss');
      
      let matchStr = '';
      if (ev.matchedPath) {
        const loc = ev.matchedPath + (ev.matchedLine ? ':' + ev.matchedLine : '');
        matchStr = '<span class="event-match">' + (ev.matchedSymbol ? ev.matchedSymbol + ' &rarr; ' : '') + loc + (ev.score !== undefined ? ' (score: ' + ev.score + ')' : '') + '</span>';
      }

      li.innerHTML = '<div class="event-top">' +
        '<span class="event-query"><span style="color: var(--text-muted);">[' + time + ']</span> "' + (ev.query || '') + '"</span>' +
        '<span>' +
          '<span class="pill pill-source">' + (ev.caller || '').toUpperCase() + '</span> ' +
          '<span class="pill ' + pillClass + '">' + (ev.status || '').toUpperCase() + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="event-meta">' +
        '<span>Tier: ' + (ev.tierRoute || '') + '</span>' +
        matchStr +
        '<span class="token-savings">' + (ev.tokensSavedPct !== undefined ? ev.tokensSavedPct + '%' : '') + ' saved (~' + (ev.payloadTokens || 0) + ' tok)</span>' +
        '<span>' + (ev.latencyMs || 0) + 'ms</span>' +
      '</div>';

      if (prepend && eventList.firstChild) {
        eventList.insertBefore(li, eventList.firstChild);
      } else {
        eventList.appendChild(li);
      }
    }

    evtSource.addEventListener('init', (e) => {
      const data = JSON.parse(e.data);
      if (data.repo) document.getElementById('repo-info').textContent = 'Repo: ' + data.repo;
      if (data.stats) updateStats(data.stats);
      if (data.events && Array.isArray(data.events)) {
        eventList.innerHTML = '';
        data.events.slice().reverse().forEach(ev => renderEvent(ev, false));
      }
    });

    evtSource.addEventListener('query', (e) => {
      const ev = JSON.parse(e.data);
      renderEvent(ev, true);
    });

    evtSource.addEventListener('stats', (e) => {
      const stats = JSON.parse(e.data);
      updateStats(stats);
    });
  </script>
</body>
</html>
